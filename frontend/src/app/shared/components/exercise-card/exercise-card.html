<div
  (click)="onCardClick()"
  class="bg-(--surface) border border-(--border) rounded-2xl py-4.5 px-5 cursor-pointer transition-all duration-150 hover:-translate-y-0.5 hover:shadow-(--shadow-md) hover:border-(--border-strong) pop-in"
>
  <div class="flex flex-col gap-2">
    <div class="flex items-center gap-1.5">
      <app-badge [label]="exercise().difficulty" [variant]="exercise().difficulty" />
      @if (status() === 'solved') {
        <app-badge label="Solved" variant="lav"><app-icon name="check" [size]="11" /></app-badge>
      } @else if (status() === 'started') {
        <app-badge label="In progress" variant="lav"><app-icon name="play" [size]="11" /></app-badge>
      }
      <span class="flex-1"></span>
      <span class="text-xs text-(--text-3) shrink-0 font-mono">#{{ exercise().id }}</span>
      @if (status() === 'started') {
        <button
          class="inline-flex items-center gap-1.25 text-sm font-bold text-(--accent-strong) bg-none border-0 cursor-pointer p-0 ml-2 shrink-0"
          (click)="onContinue($event)"
        >
          Continue <app-icon name="arrow-right" [size]="14" />
        </button>
      }
    </div>
    <div class="line-clamp-3 text-sm leading-[1.55] text-(--text) prose" [innerHTML]="exercise().question | markdown"></div>
  </div>
</div>
