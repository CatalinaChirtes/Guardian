@if (open()) {
  <div class="fade-in fixed inset-0 z-50 flex items-center justify-center max-sm:items-end p-4 max-sm:p-0 backdrop-blur-1.5 bg-(--overlay)" (click)="onBackdropClick($event)">
    <div
      class="pop-in relative bg-(--surface) border border-(--border) rounded-3xl max-sm:rounded-b-none shadow-(--shadow-lg) w-full max-w-[min(900px,calc(100%-2rem))] max-sm:max-w-full max-h-[86vh] max-sm:max-h-[92vh] flex flex-col overflow-hidden"
      (click)="$event.stopPropagation()"
    >
      <!-- header -->
      <div class="flex items-center justify-between px-5.5 py-5 border-b border-(--border)">
        <div class="flex items-center gap-2">
          <ng-content select="[modal-header]" />
        </div>
        <button
          class="icon-btn shrink-0 text-(--text-3) hover:text-(--text)"
          (click)="close()"
        >
          <app-icon name="x" [size]="18" />
        </button>
      </div>
      <!-- body -->
      <div class="flex-1 overflow-y-auto px-6 py-5.5 thin-scroll">
        <ng-content select="[modal-body]" />
      </div>
      <!-- footer -->
      <div class="flex gap-2.5 justify-end px-5.5 py-4 border-t border-(--border)">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
