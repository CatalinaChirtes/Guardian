@if (!collapsed()) {
  <div class="flex items-center gap-2.5">
    <app-avatar [name]="auth.userEmail()" size="md" />
    <div class="flex flex-col min-w-0 flex-1">
      <span class="text-sm font-bold text-(--text) truncate">{{ userName() }}</span>
      <span class="text-xs text-(--text-3) truncate">{{ auth.userEmail() }}</span>
    </div>
    <div class="flex items-center gap-1 shrink-0">
      <app-theme-toggle />
      <button
        class="icon-btn text-(--text-2)"
        (click)="logout.emit()"
        title="Log out"
      >
        <app-icon name="sign-out" [size]="18" />
      </button>
    </div>
  </div>
} @else {
  <div class="flex flex-col items-center gap-2">
    <app-avatar [name]="auth.userEmail()" size="md" />
    <app-theme-toggle />
    <button
      class="icon-btn text-(--text-2)"
      (click)="logout.emit()"
      title="Log out"
    >
      <app-icon name="sign-out" [size]="18" />
    </button>
  </div>
}
