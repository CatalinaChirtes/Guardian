<div class="py-15 px-5 text-center flex flex-col items-center gap-2 pop-in">
  <div class="w-15 h-15 rounded-2xl bg-(--surface-2) border border-(--border) flex items-center justify-center text-(--text-3)">
    <app-icon [name]="icon()" [size]="26" />
  </div>
  <span class="text-base font-bold text-(--text)">{{ title() }}</span>
  <span class="text-sm text-(--text-2)">{{ subtitle() }}</span>
</div>
