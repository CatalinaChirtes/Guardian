<app-auth-layout>
  <div class="flex flex-col gap-6">
    @if (!success()) {
      <div class="flex flex-col gap-2.5">
        <span class="text-4xl font-extrabold tracking-[-.035em] leading-[1.05] text-(--text)">Set a new<br>password.</span>
        <span class="text-base text-(--text-2) leading-normal">
          Choose a new password for your account. Must be at least 8 characters.
        </span>
      </div>

      @if (error()) {
        <div class="py-3 px-3.5 rounded-xl text-(--rose) text-sm font-semibold bg-(--rose-soft) border border-(--border-rose)">{{ error() }}</div>
      }

      <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4.5">
        <app-auth-field label="New password" icon="lock-simple" fieldId="password">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            required
            minlength="8"
            placeholder="Minimum 8 characters"
            class="flex-1 border-none bg-transparent text-(--text) text-sm outline-none min-w-0 placeholder:text-(--text-3)"
          />
          <button type="button" (click)="showPassword.set(!showPassword())" class="icon-btn" tabindex="-1">
            <app-icon [name]="showPassword() ? 'eye-slash' : 'eye'" [size]="18" />
          </button>
        </app-auth-field>

        <app-auth-field label="Confirm password" icon="lock-simple" fieldId="confirm">
          <input
            id="confirm"
            [type]="showConfirm() ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            name="confirmPassword"
            required
            minlength="8"
            placeholder="Re-enter your new password"
            class="flex-1 border-none bg-transparent text-(--text) text-sm outline-none min-w-0 placeholder:text-(--text-3)"
          />
          <button type="button" (click)="showConfirm.set(!showConfirm())" class="icon-btn" tabindex="-1">
            <app-icon [name]="showConfirm() ? 'eye-slash' : 'eye'" [size]="18" />
          </button>
        </app-auth-field>

        <button
          type="submit"
          [disabled]="loading()"
          class="w-full py-3 px-5 rounded-xl text-base font-semibold bg-(--accent) text-(--on-accent) border-none cursor-pointer transition-opacity duration-150 disabled:cursor-not-allowed"
          [ngClass]="loading() ? 'opacity-80' : ''"
        >
          {{ loading() ? 'Updating...' : 'Update password' }}
        </button>
      </form>
    } @else {
      <div class="flex flex-col items-center gap-4 text-center py-8">
        <div class="w-16 h-16 rounded-2xl bg-(--emerald-soft) grid place-items-center text-(--emerald)">
          <app-icon name="check-circle" [size]="32" />
        </div>
        <span class="text-3xl font-extrabold tracking-[-.03em] text-(--text)">Password updated</span>
        <span class="text-base text-(--text-2) leading-normal max-w-80">
          Your password has been changed successfully. Redirecting to the workspace...
        </span>
      </div>
    }

    <div class="flex gap-3 pt-2.5 pr-2.5 pb-2.5 pl-4.5 border border-(--border-strong) rounded-2xl items-center">
      <span class="text-sm font-semibold text-(--text-2) flex-1">Remember your password?</span>
      <a routerLink="/login" class="inline-block py-2 px-4 rounded-xl text-sm font-bold text-(--text) bg-(--surface) border border-(--border-strong) no-underline transition-colors duration-150 hover:bg-(--border)">Sign in</a>
    </div>
  </div>
</app-auth-layout>
